<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Anselmo Dias — Founder @ Scrollab · Full-stack &amp; Mobile Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#100826"/></linearGradient>
  <radialGradient id="glowL" cx=".15" cy=".2" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowR" cx=".85" cy=".9" r=".6"><stop offset="0" stop-color="#a855f7" stop-opacity=".25"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" x1="0" x2="1" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".35" stop-color="#e6e9ff"/><stop offset=".65" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <mask id="floorMask"><rect y="230" width="900" height="100" fill="#fff"/><rect y="230" width="900" height="40" fill="url(#floorFade)"/></mask>
  <filter id="neon" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="900" height="330" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .dim{fill:#5b6488}.txt{fill:#c9cdf2}.cy{fill:#22d3ee}.vi{fill:#c084fc}.pk{fill:#f472b6}.ok{fill:#4ade80}
  .t{font-size:12.5px}
  .type{animation:type var(--d) steps(var(--n)) var(--s) backwards}
  @keyframes type{from{clip-path:inset(-4px 100% -4px 0)}}
  .in{animation:in .7s ease-out var(--s) backwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .live{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .floor{animation:floor 2.4s linear infinite}
  @keyframes floor{to{transform:translateY(20px)}}
  .glitch{animation:glitch 7s steps(1) 3s infinite}
  @keyframes glitch{0%,96%,100%{transform:none;opacity:1}97%{transform:translate(3px,-1px);opacity:.8}98%{transform:translate(-3px,1px)}99%{transform:translate(1px,0);opacity:.9}}
</style>

<g clip-path="url(#card)">
  <rect width="900" height="330" fill="url(#bg)"/>
  <rect width="900" height="330" fill="url(#glowL)"/>
  <rect width="900" height="330" fill="url(#glowR)"/>

  <!-- piso em perspectiva -->
  <g mask="url(#floorMask)" stroke="#a855f7" stroke-opacity=".35" stroke-width="1">
    <g class="floor">
      <line x1="0" y1="232" x2="900" y2="232"/><line x1="0" y1="242" x2="900" y2="242"/>
      <line x1="0" y1="254" x2="900" y2="254"/><line x1="0" y1="268" x2="900" y2="268"/>
      <line x1="0" y1="286" x2="900" y2="286"/><line x1="0" y1="308" x2="900" y2="308"/>
      <line x1="0" y1="334" x2="900" y2="334"/><line x1="0" y1="222" x2="900" y2="222"/>
    </g>
    <line x1="450" y1="220" x2="-500" y2="330"/><line x1="450" y1="220" x2="-200" y2="330"/>
    <line x1="450" y1="220" x2="60" y2="330"/><line x1="450" y1="220" x2="260" y2="330"/>
    <line x1="450" y1="220" x2="450" y2="330"/><line x1="450" y1="220" x2="640" y2="330"/>
    <line x1="450" y1="220" x2="840" y2="330"/><line x1="450" y1="220" x2="1100" y2="330"/>
    <line x1="450" y1="220" x2="1400" y2="330"/>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="329" rx="15.5" fill="none" stroke="#1c2140"/>

<!-- coluna esquerda -->
<g class="in" style="--s:.1s">
  <rect x="40" y="40" width="158" height="24" rx="12" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/>
  <circle cx="56" cy="52" r="4" fill="#22d3ee" class="live" filter="url(#neon)"/>
  <text x="68" y="56" font-size="11" class="cy" letter-spacing="1.5">AGENT ONLINE</text>
</g>

<g class="in" style="--s:.3s">
  <text x="38" y="122" font-size="46" font-weight="800" fill="url(#name)" letter-spacing="1" class="glitch" filter="url(#neon)">ANSELMO DIAS</text>
</g>

<g class="in" style="--s:.6s">
  <text x="40" y="154" font-size="14" class="txt">Founder <tspan class="vi">@ Scrollab</tspan> · Full-stack &amp; Mobile</text>
  <text x="40" y="178" font-size="12.5" class="dim">construo produtos, agentes de IA e sistemas</text>
  <text x="40" y="196" font-size="12.5" class="dim">que rodam sozinhos em produção.</text>
</g>

<!-- terminal -->
<g class="in" style="--s:.2s">
  <rect x="470" y="34" width="394" height="196" rx="12" fill="#070914" fill-opacity=".92" stroke="#262c52"/>
  <rect x="470" y="34" width="394" height="30" rx="12" fill="#0e1124"/>
  <rect x="470" y="52" width="394" height="12" fill="#0e1124"/>
  <circle cx="490" cy="49" r="5" fill="#f472b6"/><circle cx="507" cy="49" r="5" fill="#facc15"/><circle cx="524" cy="49" r="5" fill="#4ade80"/>
  <text x="667" y="53" font-size="11" class="dim" text-anchor="middle">~/anselmo — agent.sh</text>
</g>

<text x="488" y="90" class="t type" style="--s:.9s;--d:1.1s;--n:32"><tspan class="pk">$</tspan><tspan class="txt" x="502">boot anselmo.agent --mode=ship</tspan></text>
<text x="488" y="114" class="t type" style="--s:2.2s;--d:1s;--n:46"><tspan class="cy">›</tspan><tspan class="dim" x="502">stack</tspan><tspan class="txt" x="584">ts · react · angular · rn · node</tspan></text>
<text x="488" y="136" class="t type" style="--s:3.2s;--d:.9s;--n:40"><tspan class="cy">›</tspan><tspan class="dim" x="502">runtime</tspan><tspan class="txt" x="584">llm agents · mcp · apis</tspan></text>
<text x="488" y="158" class="t type" style="--s:4.2s;--d:.9s;--n:40"><tspan class="cy">›</tspan><tspan class="dim" x="502">context</tspan><tspan class="txt" x="584">aracaju · se · br</tspan></text>
<text x="488" y="180" class="t type" style="--s:5.2s;--d:.9s;--n:40"><tspan class="cy">›</tspan><tspan class="dim" x="502">mode</tspan><tspan class="txt" x="584">dev · founder · atleta</tspan></text>
<text x="488" y="210" class="t type" style="--s:6.3s;--d:1s;--n:36"><tspan class="ok">✓</tspan><tspan class="ok" x="502">online — pronto para construir</tspan><tspan class="ok cur" dx="6">▍</tspan></text>
</svg>
