name: agent · pulse

# Regera os SVGs dinâmicos (commit pulse + snake) e publica na branch `output`.
on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6h (minuto 17 pra fugir da fila do :00)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: agent-pulse
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ▸ commit pulse
        run: node scripts/pulse.mjs ${{ github.repository_owner }}
        env:
          # PULSE_TOKEN é opcional (PAT). O GITHUB_TOKEN já lê o calendário público,
          # incluindo contagem de commits privados se isso estiver ativo no seu perfil.
          GITHUB_TOKEN: ${{ secrets.PULSE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: ▸ snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#12152b,#2e1065,#5b21b6,#9333ea,#22d3ee&color_background=#05060f

      - name: ▸ publish → output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
